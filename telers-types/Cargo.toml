[package]
name = "telers-types"
version = "10.3.0"
edition = "2021"
rust-version = "1.88.0"
description = "Telegram Bot API types without an HTTP client or bot framework"
repository = "https://github.com/Desiders/telers"
license = "MIT OR Apache-2.0"
keywords = ["telegram", "telegram-bot-api", "types", "telers"]
categories = ["api-bindings"]

[features]
default = ["serde"]
serde = ["telers-types-common/serde", "telers-types-input/serde", "telers-types-messages/serde", "dep:serde"]
deser = ["telers-types-common/deser", "telers-types-input/deser", "telers-types-messages/deser", "dep:deser"]

[dependencies]
deser = { version = "0.10", features = ["derive"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "std"], optional = true }
strum = { version = "0.28", default-features = false, features = ["std"] }
strum_macros = { version = "0.28", default-features = false }
telers-types-common = { version = "10", path = "../telers-types-common", default-features = false }
telers-types-input = { version = "10", path = "../telers-types-input", default-features = false }
telers-types-messages = { version = "10", path = "../telers-types-messages", default-features = false }

[dev-dependencies]
serde_json = "1.0"
