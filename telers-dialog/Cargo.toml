[package]
name = "telers-dialog"
version = "0.1.0"
edition = "2021"
description = "Dialog framework for telers"
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
template = ["dep:minijinja"]

[dependencies]
async-trait = "0.1"
async_fn_traits = "0.1.1"
bon = "3.9"
minijinja = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
telers = { path = "../telers", version = "1.0.0-beta.1" }
thiserror = "2.0"
time = { version = "0.3", features = ["macros"] }
tracing = "0.1"

[dev-dependencies]
telers = { path = "../telers", features = ["memory-storage"] }
tokio = { version = "1.36", features = ["macros", "rt"] }
