[package]
name = "telers-dialog"
version = "0.1.0"
edition = "2021"
description = "Dialog framework for telers"
license = "MIT OR Apache-2.0"

[dependencies]
telers = { path = "../telers", version = "1.0.0-alpha.29" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
telers = { path = "../telers", version = "1.0.0-alpha.29", features = ["memory-storage"] }
tokio = { version = "1.36", features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
