[package]
name = "telers-types-common"
version = "10.3.0"
edition = "2021"
description = "Shared Telegram Bot API models"
rust-version = "1.88.0"
repository = "https://github.com/Desiders/telers"
license = "MIT OR Apache-2.0"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]
deser = ["dep:deser", "dep:deser-json", "dep:deser-value"]

[dependencies]
deser = { version = "0.10", features = ["derive"], optional = true }
deser-json = { version = "0.10", optional = true }
deser-value = { version = "0.10", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["std", "unbounded_depth"], optional = true }
strum = { version = "0.28", default-features = false, features = ["std"] }
strum_macros = { version = "0.28", default-features = false }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
