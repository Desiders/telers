[package]
name = "dialogs_mega"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1.0"
telers = { path = "../../telers", default-features = false, features = ["default_signal", "memory-storage", "rustls-tls", "std"] }
telers-dialog = { path = "../../telers-dialog", default-features = false, features = ["rustls-tls", "template"] }
tokio = { version = "1.36", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
