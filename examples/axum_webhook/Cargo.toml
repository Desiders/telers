[package]
name = "axum_webhook"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
telers = { path = "../../telers", features = ["signal", "webhooks-axum"] }
tokio = { version = "1.28", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] } 
