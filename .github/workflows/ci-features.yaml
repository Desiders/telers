name: CI features

env:
  CARGO_TERM_COLOR: always

# Feature-combination checks rerun when a manifest or this workflow changes, so
# this lives outside `ci.yaml` to get a `paths` filter without gating the
# other jobs.
on:
  push:
    branches:
    - dev-1.x
    - master
    paths:
    - '**/Cargo.toml'
    - '.github/workflows/ci-features.yaml'
  pull_request:
    paths:
    - '**/Cargo.toml'
    - '.github/workflows/ci-features.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-hack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack
    - name: Check other workspace features
      run: >-
        cargo hack check --workspace
        --exclude telers --exclude telers-dialog --exclude dialogs_mega
        --each-feature --no-dev-deps
        --skip default,full,storages,rustls-tls,webhooks-axum,redis-storage
    - name: Check features with Serde
      run: >-
        cargo hack check -p telers -p telers-dialog -p dialogs_mega --features serde
        --each-feature --no-dev-deps
        --skip default,full,storages,rustls-tls,webhooks-axum,redis-storage
    - name: Check minimal Deser
      run: >-
        cargo hack check -p telers -p telers-dialog
        --no-default-features --features deser --no-dev-deps
