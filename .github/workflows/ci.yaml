name: CI

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches:
    - dev-1.x
    - master
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-types:
    name: Standalone Telegram types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p telers-types --locked
      - run: cargo test -p telers-types --no-default-features --features deser --locked
      - name: Keep standalone types free of the framework and HTTP clients
        shell: bash
        run: |
          cargo tree -p telers-types --edges normal --prefix none --format '{p}' --locked > types-dependencies.txt
          if grep -E '^(telers|reqwest|hyper|hyper-util|rustls|native-tls) v' types-dependencies.txt; then
            echo "telers-types must not depend on the bot framework or HTTP stack"
            exit 1
          fi

  test-methods:
    name: Standalone Telegram methods
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p telers-methods --locked
      - run: cargo test -p telers-methods --no-default-features --features deser --locked
      - run: cargo test -p telers --no-default-features --features serde --test method_reexports --locked
      - run: cargo test -p telers --no-default-features --features deser --test method_reexports --locked
      - name: Keep standalone methods free of the framework and HTTP clients
        shell: bash
        run: |
          cargo tree -p telers-methods --edges normal --prefix none --format '{p}' --locked > methods-dependencies.txt
          if grep -E '^(telers|reqwest|hyper|hyper-util|rustls|native-tls) v' methods-dependencies.txt; then
            echo "telers-methods must not depend on the bot framework or HTTP stack"
            exit 1
          fi

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --all-features --locked

  test-linux:
    name: Test Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --lib --tests --all-features --locked
      - name: Check examples
        run: cargo check --examples --locked

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo clippy --all-features --locked -- -W clippy::pedantic

  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check typos
        uses: crate-ci/typos@v1.51.1

  dependencies-are-sorted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-sort
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - name: Check that dependencies are sorted
        run: cargo sort --check --workspace --grouped

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all --check
