[package]
name = "telers"
version = "1.0.0-alpha.29"
edition = "2021"
description = "An asynchronous framework for Telegram Bot API written in Rust"
repository = "https://github.com/Desiders/telers"
license = "MIT OR Apache-2.0"
keywords = ["bot", "telegram", "telegram-bot", "telegram-bot-api", "telers"]
categories = ["web-programming", "api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["default-tls", "std"]
default-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]

# The `std` feature enables support for Rust's standard library.
# By default, some dependencies support both `std` and `no_std` environments.
# Usually, a higher MSRV is required for `no_std`.
std = ["thiserror/std", "anyhow/std", "strum/std", "serde/std", "serde_json/std"]

# Include all possible features
full = ["storages", "default-signal"]
# Include all possible storages
storages = ["redis-storage", "memory-storage"]
# For possible use redis FSM storage
redis-storage = ["redis", "deadpool-redis", "std"]
# For possible use memory FSM storage.
memory-storage = []

# Include realization of shutdown signal handler.
# Still should be registered manually, it just adds handler.
# If you want to register it automatically, use `default-signal` feature.
signal = ["tokio/signal"]
# Register signal realization automatically in serve
default-signal = ["signal"]

# Legacy feature `default-signal` with underscore naming
default_signal = ["default-signal"]

webhooks = ["subtle"]
webhooks-axum = ["webhooks", "axum"]

[dependencies]
anyhow = { version = "1.0", default-features = false }
axum = { version = "0.8", default-features = false, optional = true }
backoff = { version = "0.4", default-features = false, features = ["tokio"] }
bytes = { version = "1.5", default-features = false }
deadpool-redis = { version = "0.23", default-features = false, features = ["rt_tokio_1"], optional = true }
futures-util = { version = "0.3", default-features = false }
native-tls = { version = "0.2", optional = true }
once_cell = { version = "1.19", default-features = false }
paste = { version = "1.0", default-features = false }
pathdiff = { version = "0.2", default-features = false }
redis = { version = "1.0", default-features = false, features = ["tokio-comp"], optional = true }
regex = { version = "1.10", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc", "unbounded_depth"] }
serde_stacker = { version = "0.1", default-features = false }
serde_with = { version = "3.6", default-features = false, features = ["macros"] }
strum = { version = "0.28", default-features = false, features = ["std"] }
strum_macros = { version = "0.28", default-features = false }
subtle = { version = "2.6", default-features = false, optional = true }
takecell = { version = "0.1", default-features = false }
telers-macros = { path = "../telers-macros", version = "1.0.0-alpha.4", features = ["default"] }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.36", default-features = false, features = ["sync", "macros", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
url = { version = "2.5", optional = true }
uuid = { version = "1.7", default-features = false, features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
