[package]
name = "telers"
version = "1.0.0-alpha.24"
edition = "2021"
description = "An asynchronous framework for Telegram Bot API written in Rust"
repository = "https://github.com/Desiders/telers"
license = "MIT OR Apache-2.0"
keywords = ["bot", "telegram", "telegram-bot", "telegram-bot-api", "telers"]
categories = ["web-programming", "api-bindings", "asynchronous"]

# - `1.75.0` with `redis` feature
# - `1.81.0` without `std` feature
rust-version = "1.71.1"

[features]
default = ["default-tls", "std"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]

# The `std` feature enables support for Rust's standard library.
# By default, some dependencies support both `std` and `no_std` environments.
# Usually, a higher MSRV is required for `no_std`.
std = ["thiserror/std", "anyhow/std", "strum/std", "serde/std", "serde_json/std"]

# Include all possible features
full = ["storages", "default_signal"]
# Include all possible storages
storages = ["redis-storage", "memory-storage"]
# For possible use redis FSM storage
redis-storage = ["redis", "deadpool-redis"]
# For possible use memory FSM storage.
memory-storage = []

# Include realization of shutdown signal handler.
# Still should be registered manually, it just adds handler.
# If you want to register it automatically, use `default_signal` feature.
signal = ["tokio/signal"]
# Register signal realization automatically in serve
default_signal = ["signal"]

[dependencies]
telers-macros = { path = "../telers-macros", version = "1.0.0-alpha.3", features = ["default"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1.36", default-features = false, features = ["sync", "macros", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "stream"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_with = { version = "3.6", default-features = false, features = ["macros"] }
strum = { version = "0.27", default-features = false, features = ["std"] }
strum_macros = { version = "0.27", default-features = false }
futures-util = { version = "0.3", default-features = false }
async-trait = { version = "0.1", default-features = false }
once_cell = { version = "1.19", default-features = false }
thiserror = { version = "2.0", default-features = false }
anyhow = { version = "1.0", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
regex = { version = "1.10", default-features = false }
backoff = { version = "0.4", default-features = false }
bytes = { version = "1.5", default-features = false }
takecell = { version = "0.1", default-features = false }
pathdiff = { version = "0.2", default-features = false }
uuid = { version = "1.7", default-features = false, features = ["v4"] }

redis = { version = "0.29", default-features = false, features = ["tokio-comp"], optional = true }
deadpool-redis = { version = "0.20", default-features = false, features = ["rt_tokio_1"], optional = true }

native-tls = { version = "=0.2.13", optional = true }
url = { version = "=2.5.2", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
