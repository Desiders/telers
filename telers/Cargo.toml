[package]
name = "telers"
version = "1.0.0-beta.9"
edition = "2021"
description = "An asynchronous framework for Telegram Bot API written in Rust"
repository = "https://github.com/Desiders/telers"
license = "MIT OR Apache-2.0"
keywords = ["bot", "telegram", "telegram-bot", "telegram-bot-api", "telers"]
categories = ["web-programming", "api-bindings", "asynchronous"]
rust-version = "1.88.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["default-tls", "serde"]
default-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]

# Deser replaces Serde throughout the library when enabled.
deser = ["dep:deser", "dep:deser-json", "dep:deser-value"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_stacker", "dep:serde_with"]

# Include all possible features
full = ["storages", "default-signal"]
# Include all possible storages
storages = ["redis-storage", "memory-storage"]
# For possible use redis FSM storage
redis-storage = ["redis", "deadpool-redis"]
# For possible use memory FSM storage.
memory-storage = []

# Include realization of shutdown signal handler.
# Still should be registered manually, it just adds handler.
# If you want to register it automatically, use `default-signal` feature.
signal = ["tokio/signal"]
# Register signal realization automatically in serve
default-signal = ["signal"]

# Legacy feature `default-signal` with underscore naming
default_signal = ["default-signal"]

# For possible use SOCKS proxies in `Reqwest::with_proxy`
socks = ["reqwest/socks"]

webhooks = ["subtle"]
webhooks-axum = ["webhooks", "axum"]

# For validation of WebApp init-data and login widget signatures
webapp-validation = ["hmac", "sha2", "subtle"]

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, optional = true }
backoff = { version = "0.4", default-features = false, features = ["tokio"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bytes = { version = "1.5", default-features = false, features = ["std"] }
deadpool-redis = { version = "0.23", default-features = false, features = ["rt_tokio_1"], optional = true }
deser = { version = "=0.9.1", features = ["derive"], optional = true }
deser-json = { version = "=0.9.1", optional = true }
deser-value = { version = "=0.9.1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = { version = "0.13", default-features = false, optional = true }
native-tls = { version = "0.2", optional = true }
paste = { version = "1.0", default-features = false }
pathdiff = { version = "0.2", default-features = false }
redis = { version = "1.0", default-features = false, features = ["tokio-comp"], optional = true }
regex = { version = "1.10", default-features = false, features = ["std", "unicode-case"] }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream"] }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["std", "unbounded_depth"], optional = true }
serde_stacker = { version = "0.1", default-features = false, optional = true }
serde_with = { version = "3.6", default-features = false, features = ["macros", "std"], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
strum = { version = "0.28", default-features = false, features = ["std"] }
strum_macros = { version = "0.28", default-features = false }
subtle = { version = "2.6", default-features = false, features = ["std"], optional = true }
takecell = { version = "=0.1.1", default-features = false }
telers-macros = { path = "../telers-macros", version = "1.0.0-beta.2", features = ["default"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tokio = { version = "1.36", default-features = false, features = ["sync", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
uuid = { version = "1.7", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
serde_json = "1.0"
tokio-test = "0.4"

[[bench]]
name = "core"
harness = false
