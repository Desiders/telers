[package]
name = "telers-types-messages"
version = "10.3.0"
edition = "2021"
description = "Telegram Bot API message models"
rust-version = "1.88.0"
repository = "https://github.com/Desiders/telers"
license = "MIT OR Apache-2.0"

[features]
default = ["serde"]
serde = ["dep:serde", "telers-types-common/serde"]
deser = ["dep:deser", "telers-types-common/deser"]

[dependencies]
deser = { version = "0.10", features = ["derive"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "std"], optional = true }
strum = { version = "0.28", default-features = false, features = ["std"] }
strum_macros = { version = "0.28", default-features = false }
telers-types-common = { version = "10", path = "../telers-types-common", default-features = false }
