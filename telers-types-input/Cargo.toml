[package]
name = "telers-types-input"
version = "10.3.0"
edition = "2021"
description = "Telegram Bot API input models and inline query results"
rust-version = "1.88.0"
repository = "https://github.com/Desiders/telers"
license = "MIT OR Apache-2.0"

[features]
default = ["serde"]
serde = ["dep:serde", "telers-types-common/serde", "telers-types-resources/serde"]
deser = ["dep:deser", "telers-types-common/deser", "telers-types-resources/deser"]

[dependencies]
bytes = { version = "1.5", default-features = false, features = ["std"] }
deser = { version = "0.10", features = ["derive"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"], optional = true }
strum = { version = "0.28", default-features = false, features = ["std"] }
strum_macros = { version = "0.28", default-features = false }
telers-types-common = { version = "10", path = "../telers-types-common", default-features = false }
telers-types-resources = { version = "10", path = "../telers-types-resources", default-features = false }
tokio = { version = "1.36", default-features = false, features = ["fs", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1.7", default-features = false, features = ["std", "v4"] }
